name: Deploy Concurso Central to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build static site
        run: bun run build
        env:
          NITRO_PRESET: static
      - name: Prepare GitHub Pages files
        run: |
          if [ -d ".output/public" ]; then
            mkdir -p public-pages
            cp -a .output/public/. public-pages/
          elif [ -d "dist" ] && [ -f "dist/index.html" ]; then
            mkdir -p public-pages
            cp -a dist/. public-pages/
          else
            echo "Build did not produce a static site with index.html."
            find .output dist -maxdepth 3 -type f 2>/dev/null | head -100 || true
            exit 1
          fi
          test -f public-pages/index.html
          cp public-pages/index.html public-pages/404.html
          touch public-pages/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
